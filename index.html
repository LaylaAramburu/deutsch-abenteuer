<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutsch Abenteuer! — 20 misiones rediseñadas</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f4ff;color:#292343;font:16px/1.55 system-ui,sans-serif}header{background:#fff;border-bottom:2px solid #e8e0ff;padding:14px 22px;position:sticky;top:0;z-index:3}header button{background:none;border:0;color:#6042c6;font-size:20px;font-weight:800;cursor:pointer}.wrap{max-width:1040px;margin:24px auto;padding:0 18px}.panel{background:white;border:1px solid #e8e0ff;border-radius:22px;padding:24px;margin:18px 0;box-shadow:0 6px 22px #473a8b10}h1{font-size:clamp(26px,4vw,42px);line-height:1.1}h2{color:#5033b0}h3{margin-bottom:8px}.muted{color:#655f79}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.btn,.tile{border:2px solid #ddd4f7;border-radius:14px;background:#fff;padding:12px 16px;cursor:pointer;color:#292343;text-align:left}.btn:hover,.tile:hover{border-color:#7c60d9;background:#f4efff}.primary{background:#6545d5;color:#fff;border-color:#6545d5}.primary:hover{background:#5237b3;color:white}.good{background:#def9e9;border-color:#8dd8b3}.selected{background:#e6dfff;border-color:#6042c6}.stage{font-size:12px;font-weight:800;letter-spacing:.07em;color:#7350bf;text-transform:uppercase}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.scene{padding:15px;background:#f5efff;border-radius:14px}.prompt{font-size:19px;font-weight:750}.input{padding:13px;border:2px solid #c9bdea;border-radius:12px;font-size:18px;max-width:100%;width:350px}.chip{display:inline-block;border-radius:999px;padding:5px 12px;background:#f0e9ff;margin:4px}.feedback{min-height:26px;font-weight:700;color:#08775d}.error{color:#b13b55}.map{display:grid;grid-template-columns:repeat(3,65px);gap:6px}.cell{height:65px;border-radius:12px;background:#f0e9ff;display:grid;place-items:center;font-size:28px}.player{background:#a5ead6}.color{height:70px;min-width:110px;border:2px solid #c9bdea;border-radius:14px;display:grid;place-items:center}.progress{height:12px;background:#e8e0ff;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:#5bba9b}.list{display:grid;gap:8px}.pill{border-radius:999px;background:#f1ebff;padding:7px 13px}.hidden{display:none}.cardface{min-height:70px}.small{font-size:13px}.draw{border:2px dashed #b8a8e8;border-radius:14px;padding:18px;background:#fcfaff}.score{font-size:22px;font-weight:800}a{color:#5237b3}button:focus-visible,a:focus-visible{outline:3px solid orange;outline-offset:3px}@media(max-width:600px){.panel{padding:17px}.map{grid-template-columns:repeat(3,55px)}.cell{height:55px}}</style></head><body><header><button onclick="home()">🦊 Deutsch Abenteuer! · La brújula perdida</button></header><main class="wrap" id="app"></main><script>
const M=[{"title":"El mensaje de Foxy","emoji":"🦊","topic":"Identidad y saludos","power":"Ich heiße … / Wie heißt du?","type":"dialogue","scene":"Un mensaje incompleto llega al castillo. Para abrir la puerta, Foxy necesita presentarse.","instruction":"Ordena la conversación para que los personajes puedan conocerse.","items":["Hallo!","Wie heißt du?","Ich heiße Foxy.","Freut mich!"],"review":"Saluda y di tu nombre sin mirar la pantalla.","home":"Inventa un personaje. Escribe un saludo, una pregunta y su respuesta.","oral":{"goal":"Preséntate ante Foxy","frame":"Hallo! Ich heiße ___. Wie heißt du?","example":"Hallo! Ich heiße Mia. Wie heißt du?","ladder":"saludo → nombre → pregunta"},"input":["Hallo! = ¡Hola!","Ich heiße Foxy. = Me llamo Foxy.","Wie heißt du? = ¿Cómo te llamas?"],"mode":"dialogue","prompt":"Construye una conversación tocando las burbujas en el orden correcto."},{"title":"La tienda sin etiquetas","emoji":"🛒","topic":"Precios, artículos y números","power":"Was kostet …? / Das kostet … Euro.","type":"shop","scene":"Las etiquetas desaparecieron del mercado. Solo quedan 12 monedas para comprar la llave.","instruction":"Compra exactamente los objetos necesarios sin superar el presupuesto.","items":[["der Apfel",2],["das Brot",4],["die Milch",3],["der Käse",5],["die Banane",1]],"target":["das Brot","die Milch","die Banane"],"review":"Recuerda el saludo de la misión 1 y pregunta cuánto cuesta un objeto.","home":"Dibuja una mini tienda con cuatro productos y precios. Escribe dos preguntas Was kostet …?","oral":{"goal":"Compra dos cosas sin pasar de 12 €","frame":"Ich möchte ___ und ___. Das kostet ___ Euro.","example":"Ich möchte Brot und Milch. Das kostet sieben Euro.","ladder":"producto → segundo producto → precio"},"input":["das Brot = pan","die Milch = leche","Ich möchte … = quisiera …","Das kostet sieben Euro. = Cuesta siete euros."],"mode":"budget","prompt":"Elige los productos para la receta secreta: Brot + Milch + Banane, con máximo 12 €."},{"title":"La identidad robada","emoji":"🕵️","topic":"Pronombres y sein","power":"Ich bin … / Du bist … / Er ist …","type":"suspects","scene":"Tres visitantes dicen ser el guardián. Solo uno coincide con las pistas.","instruction":"Lee las pistas y elige al guardián verdadero.","items":[["Milo","Er ist zehn Jahre alt. Er ist ein Roboter."],["Lina","Sie ist zehn Jahre alt. Sie ist eine Detektivin."],["Otto","Er ist neun Jahre alt. Er ist ein Zauberer."]],"answer":1,"clue":"Gesucht: Sie ist zehn Jahre alt. Sie ist eine Detektivin.","review":"Preséntate y presenta a Foxy usando ich y er.","home":"Dibuja dos sospechosos. Escribe dos frases con er ist / sie ist.","oral":{"goal":"Presenta a un sospechoso","frame":"Das ist ___. Er/Sie ist ___.","example":"Das ist Lina. Sie ist eine Detektivin.","ladder":"nombre → pronombre → identidad"},"input":["Das ist Lina. = Esta es Lina.","Sie ist eine Detektivin. = Es detective.","Er ist ein Roboter. = Es un robot."],"mode":"evidence","prompt":"Interroga a tres personajes y selecciona al que coincide con la pista."},{"title":"El cohete numérico","emoji":"🚀","topic":"Números y operaciones","power":"Ich brauche … / Das sind …","type":"math","scene":"El cohete necesita combustible. Resuelve las operaciones escritas en alemán.","instruction":"Escribe el resultado en cifras para encender los motores.","items":[["drei + vier",7],["zehn - zwei",8],["fünf + sechs",11]],"review":"Di en alemán el precio de un producto de la misión 2.","home":"Inventa tres operaciones con números en alemán y resuélvelas.","oral":{"goal":"Pide combustible para el cohete","frame":"Ich brauche ___ Liter. Das sind ___ Liter.","example":"Ich brauche sieben Liter. Das sind sieben Liter.","ladder":"número → necesito → cantidad"},"input":["drei = 3 · vier = 4","sieben = 7 · acht = 8","Ich brauche … Liter. = Necesito … litros."],"mode":"calculator","prompt":"Resuelve las tres operaciones alemanas escribiendo el número."},{"title":"El monstruo de colores","emoji":"🎨","topic":"Colores y descripción","power":"Es ist rot / blau / grün.","type":"paint","scene":"Un monstruo invisible aparece cuando pintas sus tres partes correctamente.","instruction":"Sigue las instrucciones en alemán para reconstruirlo.","items":[["Kopf","rot"],["Bauch","grün"],["Beine","blau"]],"review":"Describe un personaje de la misión 3 usando sein y un color.","home":"Dibuja tu monstruo, ponle nombre y descríbelo con tres frases.","oral":{"goal":"Describe tu monstruo","frame":"Mein Monster ist ___. Der Kopf ist ___.","example":"Mein Monster ist grün. Der Kopf ist rot.","ladder":"personaje → color → parte"},"input":["der Kopf = cabeza","der Bauch = barriga","die Beine = piernas","rot · grün · blau = rojo · verde · azul"],"mode":"paint","prompt":"Pinta cada parte del monstruo según el informe del laboratorio."},{"title":"El huevo de dragón","emoji":"🐉","topic":"Animales y können","power":"Es kann fliegen. / Es kann nicht schwimmen.","type":"traits","scene":"Un dragón bebé necesita tres habilidades para escapar de una cueva.","instruction":"Elige las habilidades correctas para el dragón.","items":["fliegen","schwimmen","Feuer speien","lesen","tanzen"],"target":["fliegen","Feuer speien","tanzen"],"review":"Di de qué color es el dragón y qué puede hacer.","home":"Crea una criatura fantástica. Escribe tres cosas que puede o no puede hacer.","oral":{"goal":"Presenta las habilidades del dragón","frame":"Mein Drache kann ___, aber er kann nicht ___.","example":"Mein Drache kann fliegen, aber er kann nicht lesen.","ladder":"personaje → kann → kann nicht"},"input":["fliegen = volar","schwimmen = nadar","lesen = leer","Es kann … / Es kann nicht …"],"mode":"skills","prompt":"Construye el perfil de habilidades de un dragón fantástico."},{"title":"La familia de robots","emoji":"🤖","topic":"Familia y posesivos","power":"Das ist mein … / Das ist meine …","type":"family","scene":"Un robot ha mezclado sus fotografías familiares. Hay que reconstruir el álbum.","instruction":"Une cada familiar con la frase correcta.","items":[["Mutter","Das ist meine Mutter."],["Vater","Das ist mein Vater."],["Schwester","Das ist meine Schwester."],["Bruder","Das ist mein Bruder."]],"review":"Presenta un robot de la familia y describe un color.","home":"Dibuja una familia real o imaginaria y escribe cuatro presentaciones.","oral":{"goal":"Presenta a dos miembros de la familia robot","frame":"Das ist mein ___. Das ist meine ___.","example":"Das ist mein Vater. Das ist meine Schwester.","ladder":"masculino mein → femenino meine"},"input":["mein Vater = mi padre","meine Mutter = mi madre","mein Bruder · meine Schwester"],"mode":"family","prompt":"Repara un álbum familiar uniendo tarjetas y descripciones."},{"title":"La escuela invertida","emoji":"🏫","topic":"Objetos y negación","power":"Ich habe … / Ich habe kein …","type":"sorting","scene":"En la escuela del castillo se mezclaron objetos útiles con otros imposibles.","instruction":"Clasifica qué llevarías a clase y qué no.","items":[["das Heft","ja"],["der Bleistift","ja"],["der Drache","nein"],["das Buch","ja"],["das Raumschiff","nein"]],"review":"Di Ich habe… y añade un objeto de la misión 2 con artículo.","home":"Prepara una mochila imaginaria: tres cosas que tienes y dos que no tienes.","oral":{"goal":"Explica qué llevas en la mochila","frame":"Ich habe ___. Ich habe kein ___.","example":"Ich habe ein Buch. Ich habe kein Raumschiff.","ladder":"objeto → habe → negación"},"input":["Ich habe ein Buch. = Tengo un libro.","Ich habe kein Raumschiff. = No tengo una nave.","das Heft = cuaderno"],"mode":"sorting","prompt":"Arrastra o toca cada objeto para colocarlo en su mochila correcta."},{"title":"El calendario perdido","emoji":"📅","topic":"Días y secuencias","power":"Am Montag … / Am Dienstag …","type":"calendar","scene":"Un hechizo ha desordenado el calendario de Foxy.","instruction":"Ordena los días para que la semana vuelva a funcionar.","items":["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"],"review":"Di una actividad que puedes hacer el sábado con kann.","home":"Escribe un plan divertido para tres días de la semana.","oral":{"goal":"Cuenta dos planes semanales","frame":"Am ___ spiele ich. Am ___ lerne ich Deutsch.","example":"Am Montag spiele ich. Am Freitag lerne ich Deutsch.","ladder":"día → actividad → segundo día"},"input":["Montag = lunes","Dienstag = martes","Freitag = viernes","Am Montag … = El lunes …"],"mode":"calendar","prompt":"Recupera el orden de los siete días de la semana."},{"title":"La máquina del tiempo","emoji":"⏰","topic":"Horas y horarios","power":"Es ist … Uhr. / Um … Uhr …","type":"clock","scene":"La máquina del tiempo solo acepta tres horas secretas.","instruction":"Ajusta los relojes a las horas indicadas.","items":[["drei Uhr",3],["sieben Uhr",7],["zehn Uhr",10]],"review":"Di qué día y a qué hora empieza una aventura.","home":"Dibuja tres relojes y escribe la hora en alemán.","oral":{"goal":"Programa dos horas de la máquina","frame":"Um ___ Uhr starte ich. Um ___ Uhr schlafe ich.","example":"Um drei Uhr starte ich. Um zehn Uhr schlafe ich.","ladder":"hora → um → acción"},"input":["drei Uhr = las tres","sieben Uhr = las siete","Um drei Uhr … = A las tres …"],"mode":"clock","prompt":"Mueve las agujas del reloj hasta cada hora indicada."},{"title":"Astronauta por un día","emoji":"👩‍🚀","topic":"Rutina y verbos separables","power":"Ich stehe auf. / Ich frühstücke.","type":"timeline","scene":"Una astronauta ha olvidado su rutina en gravedad cero.","instruction":"Coloca las acciones en un orden lógico para completar su día.","items":["Ich stehe auf.","Ich frühstücke.","Ich lerne Deutsch.","Ich spiele.","Ich schlafe."],"review":"Añade una hora de la misión 10 a dos acciones.","home":"Escribe tu rutina espacial de cinco pasos con dos horas.","oral":{"goal":"Cuenta tu rutina espacial en tres pasos","frame":"Zuerst stehe ich auf. Dann ___. Danach ___.","example":"Zuerst stehe ich auf. Dann frühstücke ich. Danach spiele ich.","ladder":"inicio → después → final"},"input":["aufstehen → ich stehe auf","frühstücken → ich frühstücke","spielen → ich spiele","zuerst · dann · danach = primero · luego · después"],"mode":"timeline","prompt":"Organiza la rutina de la astronauta con tarjetas de acciones."},{"title":"La cafetería misteriosa","emoji":"🥪","topic":"Comida, acusativo frecuente","power":"Ich möchte einen Apfel. / Ich nehme das Brot.","type":"orders","scene":"Tres clientes dejaron pedidos incompletos. El cocinero necesita servirlos bien.","instruction":"Selecciona el pedido correcto para cada cliente.","items":[["Ich möchte einen Apfel.","der Apfel"],["Ich nehme das Brot.","das Brot"],["Ich möchte eine Banane.","die Banane"]],"review":"Añade el precio de dos productos y calcula cuánto cuestan.","home":"Escribe un diálogo cliente-vendedor de seis líneas con dos productos y precios.","oral":{"goal":"Haz un pedido a la cafetería","frame":"Guten Tag! Ich möchte ___, bitte. Danke!","example":"Guten Tag! Ich möchte einen Apfel, bitte. Danke!","ladder":"saludo → pedido → cortesía"},"input":["Ich möchte einen Apfel.","Ich möchte eine Banane.","Ich nehme das Brot.","bitte = por favor"],"mode":"orders","prompt":"Sirve los pedidos escuchando a los clientes y seleccionando alimentos."},{"title":"El pronóstico imposible","emoji":"🌦️","topic":"Clima y ropa","power":"Es regnet. / Ich brauche …","type":"weather","scene":"Un mago alteró el clima. Prepara el equipo adecuado para cada situación.","instruction":"Asocia cada pronóstico con un objeto útil.","items":[["Es regnet.","der Regenschirm"],["Es schneit.","die Jacke"],["Es ist sonnig.","die Sonnenbrille"]],"review":"Di un día de la semana, el clima y qué necesitas.","home":"Inventa tres días de clima extraño y explica qué necesitas.","oral":{"goal":"Explica cómo prepararte para el clima","frame":"Am ___ regnet es. Ich brauche ___.","example":"Am Montag regnet es. Ich brauche einen Regenschirm.","ladder":"día → clima → necesidad"},"input":["Es regnet. = Llueve.","Es schneit. = Nieva.","der Regenschirm = paraguas","Ich brauche … = Necesito …"],"mode":"weather","prompt":"Equipa al explorador según tres pronósticos meteorológicos."},{"title":"El armario del espía","emoji":"🧥","topic":"Ropa, colores y acusativo","power":"Ich trage … / Ich brauche …","type":"outfit","scene":"Un espía debe vestirse sin llamar la atención: lleva ropa negra y azul.","instruction":"Equipa al espía con tres prendas que respeten el código.","items":[["schwarze Jacke","schwarz"],["blaue Hose","blau"],["rote Mütze","rot"],["blaue Schuhe","blau"],["grüner Schal","grün"]],"target":["schwarze Jacke","blaue Hose","blaue Schuhe"],"review":"Describe al espía y añade el clima de la misión 13.","home":"Diseña un uniforme secreto y descríbelo con cuatro frases.","oral":{"goal":"Describe el uniforme de un espía","frame":"Ich trage eine ___ Jacke und ___ Schuhe.","example":"Ich trage eine schwarze Jacke und blaue Schuhe.","ladder":"prenda → color → segunda prenda"},"input":["die schwarze Jacke = chaqueta negra","die blaue Hose = pantalón azul","Ich trage … = Llevo puesto …"],"mode":"outfit","prompt":"Diseña un disfraz de espía sin violar el código de colores."},{"title":"La puerta de los enigmas","emoji":"🔐","topic":"Integración: artículos, números y acciones","power":"Ich habe … / Ich brauche … / Ich kann …","type":"cipher","scene":"La puerta se abre con una contraseña formada por tres pistas de aventuras anteriores.","instruction":"Resuelve las pistas y escribe la contraseña sin espacios.","items":[["Artículo de Brot: der, die o das","das"],["7 en alemán","sieben"],["Volar en alemán","fliegen"]],"answer":"dassiebenfliegen","review":"Explica por qué cada respuesta es correcta.","home":"Crea tu propia contraseña con tres pistas de unidades anteriores.","oral":{"goal":"Explica tres pistas para abrir la puerta","frame":"Ich habe ___. Ich brauche ___. Ich kann ___.","example":"Ich habe Brot. Ich brauche Hilfe. Ich kann fliegen.","ladder":"tengo → necesito → puedo"},"input":["das Brot · sieben · fliegen","Ich habe … = Tengo …","Ich brauche … = Necesito …","Ich kann … = Puedo …"],"mode":"cipher","prompt":"Descifra tres pistas de unidades anteriores para abrir la puerta."},{"title":"La ciudad pixelada","emoji":"🗺️","topic":"Lugares e indicaciones","power":"Geh geradeaus. / Geh nach rechts.","type":"maze","scene":"El mapa del castillo cambió de forma. Guía a Foxy hasta el tesoro.","instruction":"Sigue las instrucciones para desplazarte por la cuadrícula.","items":["rechts","rechts","unten","unten"],"review":"Di dónde comprarías comida y qué pedirías.","home":"Dibuja un mapa de seis lugares y escribe cuatro indicaciones.","oral":{"goal":"Guía a Foxy por la ciudad","frame":"Geh nach ___. Dann geh nach ___.","example":"Geh nach rechts. Dann geh nach unten.","ladder":"dirección → dann → dirección"},"input":["rechts = derecha","links = izquierda","oben = arriba","unten = abajo","Geh nach rechts! = Ve a la derecha"],"mode":"maze","prompt":"Guía a Foxy en un mapa mediante órdenes de movimiento."},{"title":"El robot averiado","emoji":"🛠️","topic":"Imperativo y acciones","power":"Öffne …! / Drück …! / Warte!","type":"sequence","scene":"El robot necesita reiniciarse. Ejecuta las órdenes en el orden correcto.","instruction":"Reconstruye el protocolo de reparación.","items":["Öffne die Klappe!","Drück den Knopf!","Warte!","Schließe die Klappe!"],"review":"Explica qué puede hacer el robot y de qué color es.","home":"Escribe un manual de cuatro órdenes para reparar un invento.","oral":{"goal":"Da tres instrucciones al robot","frame":"Öffne ___! Drück ___! Warte!","example":"Öffne die Klappe! Drück den Knopf! Warte!","ladder":"abrir → pulsar → esperar"},"input":["Öffne die Klappe! = Abre la tapa","Drück den Knopf! = Pulsa el botón","Warte! = Espera","Schließe die Klappe! = Cierra la tapa"],"mode":"robot","prompt":"Repara el robot accionando sus controles en orden."},{"title":"La criatura invisible","emoji":"👻","topic":"Cuerpo y descripción","power":"Es hat … / Es ist …","type":"portrait","scene":"Nadie ha visto al fantasma, pero tenemos un retrato hablado.","instruction":"Reconstruye el retrato siguiendo las pistas.","items":[["Augen","3"],["Arme","2"],["Beine","4"]],"review":"Añade una habilidad y dos colores a la descripción.","home":"Dibuja una criatura invisible y escribe cinco pistas para identificarla.","oral":{"goal":"Describe una criatura para identificarla","frame":"Sie hat ___ Augen und ___ Beine. Sie ist ___.","example":"Sie hat drei Augen und vier Beine. Sie ist blau.","ladder":"cantidad → parte → color"},"input":["die Augen = ojos","die Arme = brazos","die Beine = piernas","Es hat drei Augen. = Tiene tres ojos"],"mode":"portrait","prompt":"Construye el retrato de una criatura usando sus partes del cuerpo."},{"title":"El consejo de superhéroes","emoji":"🦸","topic":"Planes y wollen / können","power":"Ich will … / Ich kann … / Wir können …","type":"vote","scene":"Tres héroes quieren salvar el castillo. Elige el plan que resuelve las tres amenazas.","instruction":"Lee los planes y vota por el más completo.","items":[["Plan A","Wir können fliegen, aber nicht schwimmen."],["Plan B","Wir können fliegen, schwimmen und helfen."],["Plan C","Wir können tanzen, aber nicht fliegen."]],"answer":1,"review":"Explica qué habilidades del dragón de la misión 6 ayudarían.","home":"Propón un plan para salvar una ciudad con ich will y wir können.","oral":{"goal":"Propón un plan de rescate","frame":"Ich will ___. Wir können ___ und ___.","example":"Ich will helfen. Wir können fliegen und schwimmen.","ladder":"intención → habilidad → colaboración"},"input":["Ich will helfen. = Quiero ayudar","Wir können fliegen. = Podemos volar","aber = pero","und = y"],"mode":"vote","prompt":"Evalúa tres planes y defiende el único que resuelve el problema."},{"title":"La brújula recuperada","emoji":"🧭","topic":"Gran integración A1","power":"Ich bin … / Ich brauche … / Ich möchte … / Ich kann …","type":"final","scene":"Las 19 reliquias encienden la brújula. Para volver a casa hay que resolver cuatro pruebas.","instruction":"Resuelve las cuatro pruebas con conocimientos de toda la aventura.","items":[["¿Cómo te presentas?","Ich heiße Foxy."],["¿Cómo pides pan?","Ich möchte das Brot."],["¿Cómo dices que puedes volar?","Ich kann fliegen."],["¿Cómo dices que necesitas ayuda?","Ich brauche Hilfe."]],"review":"Cuenta oralmente tu aventura favorita y explica por qué.","home":"Crea una historieta de seis viñetas: un personaje, un problema, una solución y un final en alemán.","oral":{"goal":"Cuenta cómo recuperaste la brújula","frame":"Ich heiße ___. Ich brauche ___. Ich kann ___.","example":"Ich heiße Foxy. Ich brauche Hilfe. Ich kann fliegen.","ladder":"identidad → necesidad → habilidad"},"input":["Ich heiße … = Me llamo …","Ich möchte … = Quisiera …","Ich brauche … = Necesito …","Ich kann … = Puedo …"],"mode":"final","prompt":"Reúne cuatro fragmentos de alemán de misiones anteriores."}], $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let done=[];try{done=JSON.parse(localStorage.getItem('deutschV4')||'[]')}catch{}let current=0,step=0,phase='input',chosen=[],position=[0,0],clockHour=12,fail=0;
function save(){try{localStorage.setItem('deutschV4',JSON.stringify(done))}catch{}}
function button(s,fn,cls=''){return `<button class="btn ${cls}" onclick="${fn}">${esc(s)}</button>`}
function shell(x){$('app').innerHTML=x}
function home(){let pct=Math.round(done.length/20*100);shell(`<section class="panel"><span class="stage">Deutsch Abenteuer! · Edición rediseñada</span><h1>🦊 La brújula perdida</h1><p>20 problemas diferentes. Aprende las herramientas para resolverlos y usa el alemán para ayudar a Foxy.</p><div class="progress"><div style="width:${pct}%"></div></div><p><b>${done.length}/20</b> reliquias recuperadas</p><p>🎒 Inventario: ${done.length?done.map(i=>M[i].emoji).join(' '):'Todavía vacío'}</p></section><div class="grid">${M.map((m,i)=>`<button class="tile" onclick="openMission(${i})"><div style="font-size:29px">${m.emoji}</div><b>${i+1}. ${esc(m.title)}</b><p class="muted small">${esc(m.topic)}</p><span>${done.includes(i)?'✓ Completada':'▶ Explorar'}</span></button>`).join('')}</div><p class="small muted">El progreso queda solo en este navegador. Las actividades orales se revisan con la profesora.</p>`)}
function openMission(i){current=i;step=0;phase='input';chosen=[];position=[0,0];clockHour=12;fail=0;render()}
function render(){let m=M[current],s=`<section class="panel"><button class="btn" onclick="home()">← Mapa de misiones</button><p class="stage">Misión ${current+1} de 20 · ${esc(m.topic)}</p><h1>${m.emoji} ${esc(m.title)}</h1><div class="scene">${esc(m.scene)}</div><p class="muted">Objetivo comunicativo: <b>${esc(m.oral.goal)}</b></p><div class="progress"><div style="width:${phase==='input'?25:phase==='rehearse'?50:phase==='play'?75:100}%"></div></div></section>`;
if(phase==='input'){s+=`<section class="panel"><span class="stage">1 · Percibir</span><h2>Escucha, observa y descubre</h2><p>Estas son las herramientas que necesitarás para resolver el problema. Toca cada tarjeta para escucharla.</p><div class="grid">${m.input.map((v,j)=>`<button class="tile" onclick="speak(${JSON.stringify(v.split(' = ')[0]).replace(/"/g,'&quot;')})"><div class="cardface">🔊 <b>${esc(v)}</b></div></button>`).join('')}</div><p class="scene">Frase de poder: <b>${esc(m.power)}</b></p>${button('Ya reconozco las pistas →','setPhase("rehearse")','primary')}</section>`}
if(phase==='rehearse'){let frame=m.oral.frame;let words=m.oral.example.split(/\s+/);s+=`<section class="panel"><span class="stage">2 · Ensayar sin presión</span><h2>De las pistas a una frase</h2><p>Primero escucha un ejemplo completo. Después, construye tu versión con el apoyo de la plantilla.</p><div class="scene"><p><b>Modelo:</b> ${esc(m.oral.example)}</p>${button('🔊 Escuchar el modelo','speak(M[current].oral.example)')}<p><b>Tu andamio:</b> ${esc(frame)}</p><p><b>Escalera:</b> ${esc(m.oral.ladder)}</p></div><div class="draw"><label for="draft"><b>Ensayo escrito opcional (no se califica):</b></label><br><input class="input" id="draft" placeholder="Escribe o completa tu frase"><p class="small muted">Puedes leer el modelo, sustituir una palabra o hablar directamente. La profesora te ayudará.</p>${button('🔊 Escuchar mi ensayo','speakDraft()')}</div>${button('Estoy listo para el desafío →','setPhase("play")','primary')}</section>`}
if(phase==='play'){s+=`<section class="panel"><span class="stage">3 · Practicar con un problema</span><h2>${esc(m.instruction)}</h2><p class="muted">${esc(m.prompt)}</p><div id="game"></div><p id="feedback" class="feedback" aria-live="polite"></p><div class="actions">${button('💡 Ver una pista','hint()')}${button('↻ Reiniciar el reto','resetPlay()')}</div></section>`}
if(phase==='speak'){s+=`<section class="panel"><span class="stage">4 · Producir con apoyos</span><h2>🎤 ${esc(m.oral.goal)}</h2><p>Ya resolviste el problema. Ahora explícale a Foxy cómo lo hiciste.</p><div class="scene"><b>1. Repite:</b> ${esc(m.oral.example)}<div>${button('🔊 Escuchar','speak(M[current].oral.example)')}</div></div><p><b>2. Cambia uno o dos datos:</b> ${esc(m.oral.frame)}</p><p><b>3. Habla con tu profesora:</b> ${esc(m.oral.goal)}</p><div class="draw"><b>Repaso conectado:</b> ${esc(m.review)}<p class="small muted">Este puente es opcional si todavía necesita apoyo; no debe impedir completar la producción principal.</p></div><p>La profesora escucha, ofrece una reformulación si hace falta y confirma la misión. No se exige memorizar todo ni hablar sin errores.</p><div class="actions">${button('✓ Profesora: producción realizada','complete()','primary')}${button('Volver al modelo','setPhase("rehearse")')}</div></section>`}
if(phase==='done'){s+=`<section class="panel"><h2>🎉 ¡Reliquia recuperada!</h2><p>La brújula se ilumina. Ya puedes guardar tu ficha de repaso.</p><div class="actions"><a class="btn primary" href="tareas/mision-${String(current+1).padStart(2,'0')}.pdf" download>📄 Descargar tarea para casa</a>${button('Volver al mapa','home()')}</div></section>`}
shell(s);if(phase==='play')game()}
function speak(t){let msg=new SpeechSynthesisUtterance(t);msg.lang='de-DE';msg.rate=.82;if('speechSynthesis' in window){speechSynthesis.cancel();speechSynthesis.speak(msg)}else alert('Este navegador no tiene síntesis de voz.')}
function speakDraft(){let e=$('draft');if(e&&e.value.trim())speak(e.value.trim())}
function setPhase(p){phase=p;render()}
function resetPlay(){step=0;chosen=[];position=[0,0];clockHour=12;game()}
function feedback(t,ok=false){let e=$('feedback');if(e){e.textContent=t;e.className='feedback '+(ok?'':'error')}}
function hint(){feedback('Pista: '+M[current].input[Math.min(step,M[current].input.length-1)]+' · Puedes volver a escuchar las tarjetas.')}
function next(){step++;feedback('¡Bien! Has encontrado otra pista.',true);if(step>=M[current].items.length){phase='speak';render()}else game()}
function win(){phase='speak';render()}
function wrong(){fail++;feedback('Aún no. Revisa la pista o escucha de nuevo. Puedes intentarlo sin perder vidas.')}
function options(vals,handler){return `<div class="actions">${vals.map((v,i)=>button(v,`${handler}(${i})`,chosen.includes(i)?'selected':'' )).join('')}</div>`}
function game(){let m=M[current],t=m.type,h='',items=m.items;
if(['dialogue','calendar','timeline','sequence'].includes(t)){let order=items.map((v,i)=>({v,i})).sort((a,b)=>((a.i*7+3)%items.length)-((b.i*7+3)%items.length));h=`<p class="prompt">${step+1}/${items.length}: ¿qué viene ahora?</p><p class="scene">${chosen.map(i=>esc(items[i])).join(' → ')||'Secuencia vacía'}</p>${order.map(o=>button(o.v,`ordered(${o.i})`,chosen.includes(o.i)?'good':'')).join(' ')}`}
else if(t==='shop'){let sum=chosen.reduce((a,i)=>a+items[i][1],0);h=`<p class="prompt">🪙 Presupuesto: 12 € · Total: ${sum} €</p><p>La receta pide Brot + Milch + Banane.</p><div class="grid">${items.map(([v,n],i)=>button(`${v} · ${n} €`,`toggle(${i})`,chosen.includes(i)?'selected':'' )).join('')}</div>${button('Pagar en la caja','checkSelection()','primary')}`}
else if(['suspects','vote'].includes(t)){h=`<p class="scene">${esc(m.clue||'Necesitamos un plan para volar, nadar y ayudar a todos.')}</p><div class="grid">${items.map(([name,desc],i)=>`<button class="tile" onclick="choose(${i})"><b>${esc(name)}</b><p>${esc(desc)}</p>🔎 Examinar</button>`).join('')}</div>`}
else if(t==='math'){h=`<p class="prompt">${esc(items[step][0])} = ?</p><input class="input" type="number" id="answer" aria-label="Resultado numérico"> ${button('Encender motor','checkNumber()','primary')}`}
else if(t==='paint'){let colors=['rot','grün','blau','gelb'];h=`<p class="prompt">Pinta ${esc(items[step][0])} de color ${esc(items[step][1])}</p><div class="actions">${colors.map((v,i)=>`<button class="color" style="background:${['#ffaaaa','#a7edc2','#a9c9ff','#ffec91'][i]}" onclick="colorAnswer(${i})">${v}</button>`).join('')}</div>`}
else if(t==='traits'){h=`<p>Elige exactamente estas habilidades: volar, escupir fuego y bailar.</p>${options(items,'toggle')}${button('Guardar habilidades','checkSelection()','primary')}`}
else if(t==='family'){let x=items[step];h=`<p class="prompt">Álbum ${step+1}/${items.length}: ${esc(x[0])}</p><p>Selecciona la presentación correcta.</p>${options(items.map(z=>z[1]),'chooseFamily')}`}
else if(t==='sorting'){h=`<p class="prompt">Objeto ${step+1}/${items.length}: ${esc(items[step][0])}</p><p>¿Lo pondrías en la mochila de clase?</p>${options(['🎒 Ja','🚀 Nein'],'chooseSort')}`}
else if(t==='clock'){h=`<p class="prompt">Pon el reloj en: ${esc(items[step][0])}</p><div class="scene score">🕒 ${clockHour}:00</div>${button('− 1 hora','clockShift(-1)')}${button('+ 1 hora','clockShift(1)')}${button('Confirmar hora','checkClock()','primary')}`}
else if(t==='orders'){let x=items[step];h=`<p class="prompt">Cliente ${step+1}: ${esc(x[0])}</p>${button('🔊 Escuchar cliente','speak(M[current].items[step][0])')}<p>¿Qué producto sirves?</p>${options(items.map(z=>z[1]),'chooseOrder')}`}
else if(t==='weather'){let x=items[step];h=`<p class="prompt">${esc(x[0])}</p>${button('🔊 Escuchar pronóstico','speak(M[current].items[step][0])')}<p>¿Qué equipamiento necesitas?</p>${options(items.map(z=>z[1]),'chooseWeather')}`}
else if(t==='outfit'){h=`<p>El código secreto exige una chaqueta negra, pantalón azul y zapatos azules.</p><p class="scene">Elegido: ${chosen.map(i=>esc(items[i][0])).join(', ')||'Nada'}</p>${options(items.map(x=>x[0]),'toggle')}${button('Comprobar disfraz','checkSelection()','primary')}`}
else if(t==='cipher'){h=`<p class="prompt">Pista ${step+1}: ${esc(items[step][0])}</p><input class="input" id="answer" autocomplete="off" placeholder="Contraseña"> ${button('Descifrar','checkText()','primary')}`}
else if(t==='maze'){let cells='';for(let y=0;y<3;y++)for(let x=0;x<3;x++)cells+=`<div class="cell ${position[0]===x&&position[1]===y?'player':''}">${position[0]===x&&position[1]===y?'🦊':x===2&&y===2?'💎':'·'}</div>`;h=`<p class="prompt">Movimiento ${step+1}/4</p><p>Sigue la ruta: <b>${items.join(' → ')}</b></p><div class="map">${cells}</div>${options(['links','rechts','oben','unten'],'move')}`}
else if(t==='portrait'){h=`<p class="prompt">La criatura tiene ${esc(items[step][1])} ${esc(items[step][0])}. ¿Cuántas dibujas?</p>${options(['1','2','3','4'],'choosePortrait')}`}
else if(t==='final'){h=`<p class="prompt">Prueba ${step+1}/4: ${esc(items[step][0])}</p><p>Usa el modelo que ya has practicado.</p><input class="input" id="answer" placeholder="Ich …"> ${button('Comprobar','checkText()','primary')}`}
$('game').innerHTML=h}
function ordered(i){if(i!==step)return wrong();chosen.push(i);next()}
function toggle(i){chosen.includes(i)?chosen=chosen.filter(x=>x!==i):chosen.push(i);game()}
function checkSelection(){let m=M[current],selected=chosen.map(i=>Array.isArray(m.items[i])?m.items[i][0]:m.items[i]);if(selected.length===m.target.length&&m.target.every(x=>selected.includes(x)))win();else wrong()}
function choose(i){i===M[current].answer?win():wrong()}
function chooseFamily(i){i===step?next():wrong()}
function chooseSort(i){(i===0?'ja':'nein')===M[current].items[step][1]?next():wrong()}
function chooseOrder(i){i===step?next():wrong()}
function chooseWeather(i){i===step?next():wrong()}
function choosePortrait(i){['1','2','3','4'][i]===M[current].items[step][1]?next():wrong()}
function colorAnswer(i){['rot','grün','blau','gelb'][i]===M[current].items[step][1]?next():wrong()}
function checkNumber(){Number($('answer').value)===M[current].items[step][1]?next():wrong()}
function clockShift(n){clockHour=(clockHour+n+11)%12+1;game()}
function checkClock(){clockHour===M[current].items[step][1]?next():wrong()}
function checkText(){let val=$('answer').value.trim().toLocaleLowerCase('de-DE').replace(/[.!?]/g,'').replace(/\s+/g,' '),exp=String(M[current].items[step][1]).toLocaleLowerCase('de-DE').replace(/[.!?]/g,'');val===exp?next():wrong()}
function move(i){let dirs=['links','rechts','oben','unten'],d=dirs[i];if(d!==M[current].items[step])return wrong();position=[position[0]+(d==='rechts'?1:d==='links'?-1:0),position[1]+(d==='unten'?1:d==='oben'?-1:0)];next()}
function complete(){if(!done.includes(current))done.push(current);save();phase='done';render()}
home();
</script></body></html>
