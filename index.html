const $=id=>document.getElementById(id);let current=-1,stage=0,quizIndex=0,answered=false,selected=[],memory=[],opened=[],matched=[],moves=0,locked=false,stars=0,finished=[],audioAnswer=false,heard=false,bonusIndex=0,bonusDone=false;
try{stars=Number(localStorage.getItem('da-stars')||0);finished=JSON.parse(localStorage.getItem('da-finished')||'[]')}catch(e){}

function count(){ $('starCounter').textContent='⭐ '+stars+' Sterne' }
function addStar(n=1){stars+=n;persist();count()}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function goHome(){current=-1;render();window.scrollTo(0,0)}
function start(i){bonusIndex=0;bonusDone=false;window.orderLesson=-1;window.orderRewarded=false;current=i;stage=0;quizIndex=0;answered=false;selected=[];newMemory();audioAnswer=false;heard=false;render();window.scrollTo(0,0)}
function next(){if(stage<6){stage++;if(stage===3)window.orderLesson=-1;quizIndex=0;answered=false;selected=[];audioAnswer=false;heard=false;newMemory();render();window.scrollTo(0,0)}else goHome()}
function previous(){if(stage>0){stage--;quizIndex=0;answered=false;selected=[];audioAnswer=false;heard=false;newMemory();render()}}
function setStage(i){if(i===1){bonusIndex=0;bonusDone=false}if(i===3)window.orderLesson=-1;stage=i;quizIndex=0;answered=false;selected=[];audioAnswer=false;heard=false;newMemory();render()}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function newMemory(){memory=current<0?[]:shuffle(LESSONS[current].pairs.flatMap((p,i)=>[{id:i,text:p[0]},{id:i,text:p[1]}]));opened=[];matched=[];moves=0;locked=false}
function bonusPick(i){let d=LESSONS[current],correct=(4-bonusIndex)%4;bonusDone=true;window.bonusPicked=i;if(i===correct)addStar(2);render()}
function bonusNext(){bonusIndex=(bonusIndex+1)%4;bonusDone=false;render()}
function bonusHTML(){let d=LESSONS[current],k=bonusIndex,correct=(4-k)%4,kind=current%3;
 if(kind===1){let p=d.pairs[k],other=d.pairs[(k+1)%4];let opts=[p[1],other[1],d.pairs[(k+2)%4][1],d.pairs[(k+3)%4][1]];opts=opts.slice(k).concat(opts.slice(0,k));return `<div class="center"><h2>🔍 ¿Qué palabra corresponde a la imagen?</h2><div class="big">${p[0]}</div><div class="answers">${opts.map((x,i)=>`<button class="answer ${bonusDone?(i===correct?'correct':i===window.bonusPicked?'wrong':''):''}" onclick="bonusPick(${i})" ${bonusDone?'disabled':''}>${esc(x)}</button>`).join('')}</div></div>`}
 let p=d.pairs[k];let opts=[p[1],d.pairs[(k+1)%4][1],d.pairs[(k+2)%4][1],d.pairs[(k+3)%4][1]];opts=opts.slice(k).concat(opts.slice(0,k));
 return `<div class="center"><h2>⚡ ¡Reto relámpago!</h2><p>Escucha la palabra. ¿Cuál es la respuesta correcta?</p><button class="btn" onclick="speak(LESSONS[current].pairs[bonusIndex][1])">🔊 Escuchar pista</button><div class="answers">${opts.map((x,i)=>`<button class="answer ${bonusDone?(i===correct?'correct':i===window.bonusPicked?'wrong':''):''}" onclick="bonusPick(${i})" ${bonusDone?'disabled':''}>${esc(x)}</button>`).join('')}</div></div>`}
function flip(i){if(locked||opened.includes(i)||matched.includes(i))return;opened.push(i);if(opened.length===2){moves++;let [a,b]=opened;if(memory[a].id===memory[b].id){matched.push(a,b);opened=[];if(matched.length===memory.length)addStar(3)}else locked=true}render()}
function closeCards(){opened=[];locked=false;render()}
function checkAnswer(i){if(answered)return;answered=true;let q=LESSONS[current].questions[quizIndex];if(i===q[2])addStar(2);window.lastChoice=i;render()}
function quizNext(){if(quizIndex<LESSONS[current].questions.length-1){quizIndex++;answered=false;render()}else next()}
function chooseToken(i){if(selected.includes(i))return;selected.push(i);render()}
function resetTokens(){selected=[];render()}
function checkTokens(){let words=LESSONS[current].order;let choice=selected.map(i=>window.orderShuffled[i].w);let ok=choice.join(' ')===words.join(' ');window.orderResult=ok?'¡Excelente! Frase completa.':'Casi. Prueba otro orden.';if(ok&&!window.orderRewarded){addStar(3);window.orderRewarded=true}render()}

function topSection(d){return `<div class="sectionhead"><h2>${d.emoji} ${esc(d.title)}</h2><span class="chip">Unidad ${current+1} / 20</span></div><div class="progress"><span style="width:${Math.round(stage/6*100)}%"></span></div><div class="steps">${['Descubre','Memory','Detective','Puzzle','Escucha','Habla','Tesoro'].map((x,i)=>`<button class="step ${i===stage?'current':i<stage?'finished':''}" onclick="setStage(${i})">${i<stage?'✓ ':''}${i+1}. ${x}</button>`).join('')}</div>`}

function render(){count();if(current===-1){$('app').innerHTML=`<section class="hero"><div><span class="tag">🇩🇪 Alemán A1 · 10 años · 20 aventuras</span><h1>¡Un mundo por descubrir!</h1><p>Ayuda a Foxy a resolver misterios, entrenar la memoria, construir frases y hablar alemán. Cada aventura tiene seis desafíos y un tesoro final.</p><button class="btn alt" onclick="start(0)">🚀 ¡Empezar la aventura!</button></div><div class="mascot">🦊</div></section><div class="sectionhead"><h2>🗺️ Mapa de aventuras</h2><span class="chip">20 clases · ~45 min cada una</span></div><div class="grid">${LESSONS.map((d,i)=>`<button class="tile ${finished.includes(i)?'done':''}" onclick="start(${i})"><span class="emo">${d.emoji}</span><span class="chip">${finished.includes(i)?'✓ Completada':'Misión '+(i+1)}</span><strong>${esc(d.title)}</strong><p>${esc(d.goal)}</p></button>`).join('')}</div><section class="panel"><h2>👩‍🏫 Zona de profesora</h2><p>Las clases están organizadas de menor a mayor complejidad. Cada unidad incluye actividades interactivas y una tarea de producción oral supervisada.</p><button class="btn ghost" onclick="showTeacher()">📋 Ver guía de las 20 clases</button> <a class="btn ghost" href="clasico.html" style="display:inline-block;text-decoration:none;margin:8px">🦊 Abrir versión clásica</a><div id="teacherGuide"></div></section>`;return}
let d=LESSONS[current],html=topSection(d);
if(stage===0){html+=shell('🔎 Descubre el mundo','Mira, escucha y repite. ¿Qué palabras ya conoces?',`<div class="goal"><b>🎯 Objetivo:</b> ${esc(d.goal)}<br><b>🧩 Gramática:</b> ${esc(d.grammar)}</div><div class="cards">${d.pairs.map(p=>`<button class="vocab" onclick="speak(${JSON.stringify(p[1]).replace(/"/g,'&quot;')})"><span class="icon">${p[0]}</span><span><b>${esc(p[1])}</b><small>🔊 Escuchar</small></span></button>`).join('')}</div><h3>💬 Frases de la aventura</h3>${d.phrases.map(x=>`<button class="answer" onclick="speak(this.dataset.say)" data-say="${esc(x)}">🔊 ${esc(x)}</button>`).join('')}<p class="mini">Desafío: tapa las palabras e intenta recordar dos.</p>`)}
if(stage===1 && current%3===0){html+=shell('🧠 Memory de Foxy','Encuentra las cuatro parejas. Observa bien: ¡entrenamos memoria y atención!',`<div class="memory">${memory.map((m,i)=>`<button class="mem ${matched.includes(i)?'found':opened.includes(i)?'open':''}" onclick="flip(${i})" ${matched.includes(i)?'disabled':''}>${matched.includes(i)||opened.includes(i)?esc(m.text):'❔'}</button>`).join('')}</div><p class="center"><b>${matched.length/2} / 4 parejas</b> · ${moves} intentos</p>${locked?'<div class="center"><button class="btn" onclick="closeCards()">👀 Volver a esconder</button></div>':''}${matched.length===8?'<div class="notice success">🌟 ¡Todas las parejas encontradas! +3 estrellas.</div>':''}<div class="center"><button class="btn ghost" onclick="newMemory();render()">🔀 Mezclar otra vez</button></div>`)}
if(stage===1 && current%3!==0){html+=shell(current%3===1?'🔎 Detective visual':'⚡ Reto relámpago',current%3===1?'Observa los símbolos y descubre la palabra alemana.':'Escucha con atención y encuentra la palabra correcta.',`<span class="badge">Ronda ${bonusIndex+1} de 4</span>${bonusHTML()}${bonusDone?`<div class="notice ${window.bonusPicked===(4-bonusIndex)%4?'success':'error'}">${window.bonusPicked===(4-bonusIndex)%4?'🌟 Richtig!':'💡 La respuesta era: '+esc(d.pairs[bonusIndex][1])}</div><button class="btn" onclick="bonusNext()">Otra ronda →</button>`:''}`)}
if(stage===2){let q=d.questions[quizIndex];let correct=answered&&window.lastChoice===q[2];html+=shell('🕵️ Detective de gramática','Foxy encontró pistas falsas. Escoge la forma correcta y descubre la regla.',`<span class="badge">Pregunta ${quizIndex+1} de ${d.questions.length}</span><h3 class="big">${esc(q[0])}</h3><div class="answers">${q[1].map((opt,i)=>`<button class="answer ${answered?(i===q[2]?'correct':i===window.lastChoice?'wrong':''):''}" onclick="checkAnswer(${i})" ${answered?'disabled':''}>${esc(opt)}</button>`).join('')}</div>${answered?`<div class="notice ${correct?'success':'error'}"><b>${correct?'🌟 Richtig!':'💡 Buena pista para aprender'}</b><p>${esc(q[3])}</p></div><button class="btn" onclick="quizNext()">${quizIndex===d.questions.length-1?'Terminar reto →':'Otra pista →'}</button>`:''}`,false)}
if(stage===3){let words=d.order;if(!window.orderShuffled||window.orderLesson!==current){window.orderShuffled=shuffle(words.map((w,i)=>({w,i})));window.orderLesson=current;window.orderResult=''}let done=selected.length===words.length;html+=shell('🧩 La frase secreta','Toca las palabras en el orden correcto para abrir la puerta.',`<div class="sentence"><div class="tokens">${selected.map(i=>`<span class="token">${esc(window.orderShuffled[i].w)}</span>`).join('')||'<span class="muted">Aquí aparecerá tu frase...</span>'}</div></div><div class="tokens">${window.orderShuffled.map((w,i)=>`<button class="token" onclick="chooseToken(${i})" ${selected.includes(i)?'disabled':''}>${esc(w.w)}</button>`).join('')}</div><div class="center"><button class="btn ghost" onclick="resetTokens();window.orderResult='';render()">↻ Volver a empezar</button> <button class="btn" ${!done?'disabled':''} onclick="checkTokens()">🔓 Comprobar</button></div>${window.orderResult?`<div class="notice">${window.orderResult}</div>`:''}<p class="mini">Pista: empieza por una palabra con mayúscula. Escucha tu frase cuando esté correcta.</p>`)}
if(stage===4){let target=d.phrases[quizIndex%d.phrases.length],others=d.phrases.filter(x=>x!==target),options=shuffle([target,...others]).slice(0,3);if(!window.audioOptions||window.audioKey!==current+'-'+quizIndex){window.audioOptions=options;window.audioKey=current+'-'+quizIndex}let ix=window.audioOptions.indexOf(target);html+=shell('👂 Radio secreta','Escucha la frase en alemán y selecciona lo que has oído.',`<p class="center">Mensaje ${quizIndex+1} de ${d.phrases.length}</p><div class="center"><button class="btn" onclick="speak(LESSONS[current].phrases[quizIndex]);heard=true">🔊 Escuchar mensaje</button></div><div class="answers">${window.audioOptions.map((x,i)=>`<button class="answer ${audioAnswer?(i===ix?'correct':''):''}" onclick="audioPick(${i},${ix})" ${audioAnswer?'disabled':''}>${esc(x)}</button>`).join('')}</div>${audioAnswer?`<div class="notice success">🎧 La frase era: ${esc(target)}</div><button class="btn" onclick="audioNext()">${quizIndex+1===d.phrases.length?'Siguiente misión →':'Siguiente mensaje →'}</button>`:''}<p class="mini">El audio utiliza la voz alemana del navegador. Si no hay voz disponible, la profesora puede leer la frase.</p>`,false)}
if(stage===5){html+=shell('🎭 ¡Habla para ganar!','Aquí el protagonista eres tú: usa el alemán para cumplir la misión.',`<div class="goal"><h3>🎯 Tu misión oral</h3><p class="big">${esc(d.oral)}</p></div><h3>🗣️ Ayudas que puedes escuchar</h3>${d.phrases.map(x=>`<button class="answer" data-say="${esc(x)}" onclick="speak(this.dataset.say)">🔊 ${esc(x)}</button>`).join('')}<div class="notice">👩‍🏫 Tu profesora escucha, pregunta y te ayuda. Cuando completes el desafío, pulsa «Abrir el tesoro».</div><div class="center"><button class="btn" onclick="complete()">🗝️ Abrir el tesoro →</button></div>`,false)}
if(stage===6){html+=`<div class="finish"><div style="font-size:70px">🏆🦊🌟</div><h2>Mission geschafft!</h2><p>¡Foxy ha recuperado otra llave del castillo!</p><h3>${esc(d.title)}</h3><p>Has escuchado, recordado, pensado y hablado alemán.</p><div class="goal">🏅 <b>Super Sprachheld!</b><br><small>Unidad ${current+1} completada</small></div><button class="btn" onclick="goHome()">🗺️ Volver al mapa</button> <button class="btn ghost" onclick="start(${current})">↻ Repetir</button></div>`}
$('app').innerHTML=html}
function audioPick(i,correct){if(audioAnswer)return;audioAnswer=true;if(i===correct)addStar(2);render()}
function audioNext(){if(quizIndex+1<LESSONS[current].phrases.length){quizIndex++;audioAnswer=false;window.audioKey='';render()}else next()}
